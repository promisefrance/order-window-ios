workflows:
  ios-testflight:
    name: Plan the Plate iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: PlanThePlateKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.promisefrance.orderwindow
      vars:
        APP_STORE_APPLE_ID: 6838885081
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install web dependencies
        script: npm ci
      - name: Sync web app into iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.promisefrance.orderwindow" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build the app
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
